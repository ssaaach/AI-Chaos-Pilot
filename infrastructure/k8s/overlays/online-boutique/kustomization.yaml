apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: boutique
resources:
  - ../../base/namespace.yaml
  - ../../../../application/online-boutique/release/kubernetes-manifests.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: loadgenerator
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 0
